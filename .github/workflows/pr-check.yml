name: PR checks

on:
  pull_request: {}

jobs:
  pr-check:
    name: PR checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            .bun
            node_modules
            .cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/package.json') }}

      - name: Install dependencies
        run: bun install

      - name: Run lint (biome)
        run: bun run lint

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build
