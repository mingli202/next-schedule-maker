name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-check:
    name: PR checks
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            .bun
            node_modules
            .cache
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint (biome)
        id: lint
        continue-on-error: true
        run: bun run lint

      - name: Run tests
        id: test
        continue-on-error: true
        run: bun test

      - name: Build
        id: build
        continue-on-error: true
        run: bun run build

      - name: Comment PR with step results
        if: ${{ always() && github.event.pull_request.head.repo.fork == false }}
        uses: actions/github-script@v7
        with:
          script: |
            const lint = '${{ steps.lint.outcome }}';
            const test = '${{ steps.test.outcome }}';
            const build = '${{ steps.build.outcome }}';
            const marker = '<!-- pr-check-results -->';

            const icon = (outcome) => {
              if (outcome === 'success') return '✅';
              if (outcome === 'failure') return '❌';
              if (outcome === 'cancelled') return '⚪';
              return '⚠️';
            };

            const body = [
              marker,
              '## PR Check Results',
              '',
              '| Step | Result |',
              '| --- | --- |',
              `| Lint | ${icon(lint)} \`${lint}\` |`,
              `| Tests | ${icon(test)} \`${test}\` |`,
              `| Build | ${icon(build)} \`${build}\` |`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const previousComment = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );

            if (previousComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previousComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if any check failed
        if: ${{ always() }}
        run: |
          if [ "${{ steps.lint.outcome }}" != "success" ] || \
             [ "${{ steps.test.outcome }}" != "success" ] || \
             [ "${{ steps.build.outcome }}" != "success" ]; then
            exit 1
          fi
